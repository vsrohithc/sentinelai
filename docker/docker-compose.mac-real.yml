# SentinelAI — Real API Stack (Apple Silicon / ARM64)
#
# Uses a real OpenAI API key instead of WireMock stubs.
# Detection is disabled (risk scores will show as N/A) — no third-party
# detection service required.
#
# Usage:
#   export OPENAI_API_KEY=sk-...
#   export SIGNING_PRIVATE_KEY=$(base64 -i private.pem)
#   export SIGNING_PUBLIC_KEY=$(base64 -i public.pem)
#   docker compose -f docker/docker-compose.mac-real.yml up -d
#
# Generate keypair (one time only):
#   openssl genpkey -algorithm ed25519 -out private.pem
#   openssl pkey -in private.pem -pubout -out public.pem
# Signing is optional — omit SIGNING_* vars to disable it.

services:

  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: sentinelai-real-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: sentinelai_real
    volumes:
      - real-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai -d sentinelai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sentinelai-real

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: sentinelai-backend:demo
    platform: linux/arm64
    container_name: sentinelai-real-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sentinelai
      DB_USERNAME: sentinelai
      DB_PASSWORD: sentinelai_real
      OPENAI_API_URL: https://api.openai.com/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SIGNING_PRIVATE_KEY: ${SIGNING_PRIVATE_KEY:-}
      SIGNING_PUBLIC_KEY: ${SIGNING_PUBLIC_KEY:-}
      DETECTION_STRATEGY: none
      SENTINEL_API_KEYS: ""
      RATE_LIMIT_CAPACITY: 100
      RATE_LIMIT_REFILL_PER_MINUTE: 60
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      SHOW_SQL: "false"
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - sentinelai-real

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: sentinelai-frontend:demo
    platform: linux/arm64
    container_name: sentinelai-real-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - sentinelai-real

volumes:
  real-postgres-data:
    driver: local

networks:
  sentinelai-real:
    driver: bridge
