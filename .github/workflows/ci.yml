name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new push — avoids queuing
# stale runs when commits land quickly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — build, test, coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: backend
        env:
          # Integration tests use H2 (profile=test), so no real DB is needed.
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B verify --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: Coverage summary (PR comment)
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          # Warn (but don't fail the PR check) if coverage drops below 80%
          min-coverage-overall: 80
          min-coverage-changed-files: 70
          title: "Coverage Report"
          update-comment: true

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # Prefer `npm ci` for reproducibility, but fall back to `npm install`
        # when no lockfile is present (so a fresh clone before the first
        # lockfile is committed does not break CI). Commit package-lock.json
        # to make this branch obsolete.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "WARNING: package-lock.json is missing — falling back to npm install."
            echo "Run 'npm install' locally and commit package-lock.json for reproducible builds."
            npm install --no-audit --no-fund
          fi

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        # tsc --noEmit validates types without producing output files
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 7

  # ── Docker smoke test ──────────────────────────────────────────────────────
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: sentinelai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: sentinelai-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
