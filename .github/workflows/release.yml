# Release workflow
#
# Triggered when a tag matching v*.*.* (semver) is pushed.
# Builds the backend JAR, the frontend bundle, and the Docker images,
# publishes the images to GHCR with both the version tag and `latest`,
# and creates a GitHub Release with the artifacts attached.
#
# Tagging a release:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Or use the GitHub UI: Releases → "Draft a new release" → create new tag.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to upload artifacts to the GitHub Release
  packages: write   # required to push images to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  # ── Build artifacts ─────────────────────────────────────────────────────────
  build:
    name: Build backend JAR + frontend bundle
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        # Strip leading "refs/tags/v" → e.g. "0.1.0"
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        # -DskipTests because tests run in the main CI workflow; this job is
        # release-builder, not validator. The release is only fired after CI
        # passes on main.
        run: mvn -B package -DskipTests --no-transfer-progress

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # Fall back to npm install if the lockfile is missing, so the release
        # doesn't break during the first release before a lockfile is committed.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Zip frontend bundle
        run: |
          cd frontend
          zip -r "../sentinelai-frontend-${{ steps.version.outputs.version }}.zip" dist

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/sentinelai-backend-*.jar
          retention-days: 1

      - name: Upload frontend zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-zip
          path: sentinelai-frontend-*.zip
          retention-days: 1

  # ── Build and push Docker images ────────────────────────────────────────────
  docker:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/sentinelai-backend:${{ needs.build.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/sentinelai-backend:latest
          # GitHub Actions cache speeds up subsequent releases substantially.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/sentinelai-frontend:${{ needs.build.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/sentinelai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so changelog generation has tag context

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: dist

      - name: Download frontend zip artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-zip
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          # The tag that triggered the workflow is used as both the release tag
          # and the release name. Pre-releases (v0.x.x or vX.Y.Z-rc1) are
          # detected automatically by softprops/action-gh-release.
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.jar
            dist/*.zip
          body: |
            SentinelAI ${{ github.ref_name }}

            ## Docker images

            ```
            docker pull ghcr.io/${{ env.IMAGE_NAMESPACE }}/sentinelai-backend:${{ needs.build.outputs.version }}
            docker pull ghcr.io/${{ env.IMAGE_NAMESPACE }}/sentinelai-frontend:${{ needs.build.outputs.version }}
            ```

            See [CHANGELOG.md](CHANGELOG.md) for the full list of changes.
