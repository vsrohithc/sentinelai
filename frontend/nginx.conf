# Nginx configuration for the SentinelAI dashboard.
#
# Design decisions:
#   1. API proxy — /api/* is forwarded to the backend container so the browser
#      never crosses origins. This avoids CORS entirely.
#   2. SPA routing — unknown paths return index.html so React Router can handle
#      them on the client side.
#   3. Cache control — Vite injects content hashes in asset filenames, so
#      hashed assets can be cached indefinitely (immutable). index.html must
#      not be cached so browsers always fetch the latest entry point.
#   4. Gzip — enabled for text assets to reduce bandwidth.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ── API proxy → backend container ───────────────────────────────────────
    # All /api/* requests are forwarded to the Spring Boot backend.
    # The backend service name "backend" must match the service name in
    # docker-compose.prod.yml. Docker's internal DNS resolves it.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts: the proxy endpoint can take a few seconds on first warm-up
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    10s;
    }

    # ── Actuator proxy (for ops dashboards / health checks) ─────────────────
    location /actuator/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Static assets with content hash in filename ──────────────────────────
    # Vite outputs files like /assets/index-Bf3kDH4J.js — the hash changes
    # whenever the file content changes, so we can cache these indefinitely.
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── index.html — never cache ─────────────────────────────────────────────
    # The entry point must always be fresh so the browser picks up new
    # asset hashes after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── SPA catch-all ────────────────────────────────────────────────────────
    # For any path that is not a real file, serve index.html and let React
    # Router handle the route on the client side.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
